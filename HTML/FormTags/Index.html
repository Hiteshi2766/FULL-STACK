<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic Forms</title>
  </head>
  <body>
    <fieldset>
        <legend align="center">Basic Form </legend>
            <form>
      <label for="FullName">Full Name :-</label>
      <input
        type="text"
        name="FullName"
        id="FullName"
        placeholder="Enter Name"
      />

      <br />
      <br />

      <label for="email"> E-mail:</label>
      <input
        type="email"
        name="e-mail"
        id="email"
        placeholder="Enter the E-mail"
      />
      <br />
      <br />
      <label for="password">Password</label>
      <input
        type="password"
        name="password"
        id="password"
        placeholder="Enter your Password"
      />
      <br />
      <br />
      <label for="cfpassword">Confirm Password</label>
      <input
        type="password"
        name="cfpassword"
        id="cfpassword"
        placeholder="Confirm your Password"
      />
      <br />
      <br />
      <label for="dob">Date Of Birth</label>
      <input type="date" name="dob" id="dob" />
      <br />
      <br />
      <label for="time"></label>
      <input type="time" name="time" id="time" />
      <br />
      <br />
      <label for="joiningtime"> Joining Time</label>
      <input type="datetime-local" name="joiningtime" id="joiningtime" />
      <br />
      <br />
      <label for="volume">Volume</label>
      <input
        type="range"
        name="volume"
        id="volume"
        min="0"
        max="10"
        value="3"
      />
      <br />
      <br />
      <label for="number">Mobile Number</label>
      <input type="number" name="number" id="number" />
      <br />
      <br />
       <label for="resume">Resume: </label>
      <input type="file" name="resume" id="resume" />
      <br />
      <br />
      <label for="address">Address: </label>
      <textarea name="address" id="address"></textarea>
      <br />
      <br />
      <label for="course"> Course</label>
      <select name="course" id="course">
        <option value="">--Select Course--</option>
        <option value="btech">B.Tech</option>
        <option value="mtech">M.Tech</option>
        <option value="bba">BBA</option>
        <option value="mba">MBA</option>
      </select>
      <br>
      <br>
      <label for="gender">Gender :</label>
      <input type="radio" name="gender" id="male" value="male" /> <span>Male</span>
      <input type="radio" name="gender" id="female" value="female" /> <span>Female</span>
            <input type="radio" name="gender" id="others" value="others" /> <span>Others</span>
            <br>
      <br>
      <label for="SkillSet">Skill Set :</label>
      <input type="checkbox" name="SkillSet" id="Java" value="Java" /> <span>Java</span>
      <input type="checkbox" name="SkillSet" id="DSA" value="DSA" /> <span>DSA</span>
            <input type="checkbox" name="SkillSet" id="HTML" value="HTML" /> <span>HTML</span>





      <button>Submit</button>
    </form>   
    </fieldset>
    
    <img src="./WhatsApp Image 2026-07-10 at 5.59.40 PM.jpeg" alt="" width="100px"
    length = "100px" />
  </body>
</html>
