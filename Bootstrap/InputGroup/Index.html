<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container p-3 border mt-3 rounded">
      <div class="display-6 fw-semibold">Course Search and Subscription</div> <br>
      
      <div class="input-group">
        <input type="text" name="search" class="form-control" placeholder="Search for a course" />
        <button class="btn btn-primary">Search</button>
      </div>
      <br />
      <div class="input-group">
        <input type="text" name="search" class="form-control" placeholder="Enter your email" />
        <button class="btn btn-success">Subscribe</button>
      </div>
      <br />
      <div class="input-group">
        <span class="input-group-text">@</span>
        <input
          type="text"
          name="search"
          class="form-control"
          placeholder="Username"
        />
      </div>
      <div>
        <label for="">Email</label>
        <input
          type="text"
          name="search"
          value="invalid-email"
          class="form-control is-invalid"
        />
        <span class="fs-6 text-danger">Please enter a valid email</span>
      </div>
      <div>
        <label for="">Email</label>
        <input
          type="text"
          name="search"
          value="student@example.com"
          class="form-control is-valid"
        />
      </div>
<br>
      <button
        type="button"
        class="btn btn-primary"
        data-bs-toggle="modal"
        data-bs-target="#exampleModal"
      >
        RICR
      </button>

      <!-- Modal -->
      <div
        class="modal fade"
        id="exampleModal"
        tabindex="-1"
        aria-labelledby="exampleModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h1 class="modal-title fs-5" id="exampleModalLabel">
                Modal title
              </h1>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">...</div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Close
              </button>
              <button type="button" class="btn btn-primary">
                Save changes
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
